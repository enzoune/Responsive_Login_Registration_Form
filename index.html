<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login e Cadastro Responsivos</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <input type="checkbox" id="check">
        <div class="login form">
            <header>Login</header>
            <form action="#">
                <input type="text" placeholder="Coloque seu e-mail">
                <input type="password" placeholder="Coloque seu senha">
                <a href="#">Esqueci a senha</a>
                <input type="button" class="button" value="Login">
            </form>
            <div class="signup">
                <span class="signup">Não tem uma conta?</span>
                <label for="check">Cadastre-se</label>
            </div>
        </div>

        <div class="registration form">
            <header>Cadastre-se</header>
            <form action="#">
                <input type="text" placeholder="Coloque seu e-mail">
                <input type="password" placeholder="Crie uma senha">
                <input type="password" placeholder="Confirme sua senha">
                <input type="button" class="button" value="Cadastrar">
            </form>
            <div class="signup">
                <span class="signup">Já tem uma conta?</span>
                <label for="check">Login</label>
            </div>
        </div>
    </div>
</body>
</html>
